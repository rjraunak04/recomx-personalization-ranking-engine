name: RecomX CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: recomx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Diff hygiene
        run: git diff --check

      - name: Unit tests
        run: python -m pytest -q

  container-contract:
    name: Container contract
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: |
          grep -q "FROM python:3.12-slim" Dockerfile
          grep -q "USER recomx" Dockerfile
          grep -q "recomx.serving.production:create_production_app" Dockerfile
          grep -q -- "--factory" Dockerfile
          ! grep -q "COPY data/processed ./" Dockerfile
          ! grep -q "ratings_test_locked" Dockerfile
          grep -q "EXPOSE 8000" Dockerfile
